<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Candidate Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginSection">
        <h1>🔒 Candidate Search</h1>
        <div class="login-box">
            <h2>Login Required</h2>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" value="admin">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <button onclick="login()">Login</button>
            <div id="loginError" class="error hidden"></div>
        </div>
    </div>

    <div id="appSection" style="display:none">
        <h1>🔍 Candidate Search <button class="logout-btn" onclick="logout()">Logout</button></h1>
        
        <div class="search-box">
            <div class="search-input">
                <input type="text" id="searchInput" placeholder="Search by name..." autocomplete="off">
                <button onclick="search()">Search</button>
            </div>
            <div class="filter-bar">
                <div class="filter-chips" id="filterChips"></div>
                <div class="add-filter-wrapper">
                    <button class="add-filter-btn" onclick="toggleFilterMenu()">+ Add Filter</button>
                    <div class="filter-menu hidden" id="filterMenu">
                        <div class="filter-menu-item" onclick="addFilter('lang')">Programming Language</div>
                        <div class="filter-menu-item" onclick="addFilter('cloud')">Cloud Expertise</div>
                        <div class="filter-menu-item" onclick="addFilter('experience')">Years of Experience</div>
                        <div class="filter-menu-item" onclick="addFilter('expectedSalary')">Expected Salary</div>
                        <div class="filter-menu-item" onclick="addFilter('currentSalary')">Current Salary</div>
                        <div class="filter-menu-item" onclick="addFilter('arrangement')">Working Arrangement</div>
                        <div class="filter-menu-item" onclick="addFilter('notice')">Notice Period</div>
                        <div class="filter-menu-item" onclick="addFilter('position')">Current Position</div>
                        <div class="filter-menu-item" onclick="addFilter('tools')">Tools & Frameworks</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="results" id="results">
            <div class="empty-state">Enter a name to search for candidates</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
